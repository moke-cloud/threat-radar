name: ThreatRadar daily collection

on:
  schedule:
    # 06:30 JST = 21:30 UTC (previous day)
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source IDs to fetch (blank = all)"
        required: false
        default: ""
      dry:
        description: "Dry run (no commit)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: threat-radar-collect
  cancel-in-progress: false

jobs:
  # 1) Fetch feeds, apply cached translations, publish. Takes ~2 minutes,
  #    so new items appear without waiting for translation.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: collector/go.sum

      - name: Test collector
        working-directory: collector
        run: go test ./...

      - name: Test dashboard helpers
        run: node --test web/test/*.test.js

      - name: Build collector
        working-directory: collector
        run: go build -o ../collector-bin ./cmd/collector

      - name: Run collector
        # No secrets. Feeds are public.
        run: |
          ARGS="-config config.yaml -out data -translate cache"
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS -only ${{ github.event.inputs.only }}"
          fi
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then
            ARGS="$ARGS -dry"
          fi
          ./collector-bin $ARGS

      - name: Commit data
        if: github.event.inputs.dry != 'true'
        run: |
          bash scripts/commit-data.sh "data: threat-radar update"

  deploy-pages:
    needs: collect
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      artifact-name: github-pages-collect

  # 2) Translate on a local model (llama.cpp + Qwen3, pinned and
  #    checksum-verified, cached), then publish again. Feed text never
  #    leaves the runner. A failure here leaves the published data as is.
  translate:
    needs: collect
    if: github.event.inputs.dry != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: collector/go.sum

      - name: Build collector
        working-directory: collector
        run: go build -o ../collector-bin ./cmd/collector

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/llm
          key: llm-${{ hashFiles('scripts/start-llm.sh') }}

      - name: Start translation model
        run: bash scripts/start-llm.sh

      - name: Translate
        run: ./collector-bin -config config.yaml -out data -skip-fetch -translate run

      - name: Commit translations
        run: |
          bash scripts/commit-data.sh "data: translations"

  deploy-pages-translated:
    needs: [translate, deploy-pages]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      artifact-name: github-pages-translated
