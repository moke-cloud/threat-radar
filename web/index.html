<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d12">
  <meta name="color-scheme" content="dark light">
  <title>ThreatRadar — 脅威情報ダッシュボード</title>
  <meta name="description" content="CISA KEV / NVD / JPCERT / 主要ベンダーの脅威リサーチを自動収集し、EPSS を添えてスコアリング。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230a0d12'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%236ee0c8' stroke-width='2.5'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%236ee0c8' stroke-width='2'/%3E%3Cline x1='32' y1='6' x2='32' y2='58' stroke='%236ee0c8' stroke-width='2'/%3E%3Cline x1='6' y1='32' x2='58' y2='32' stroke='%236ee0c8' stroke-width='2'/%3E%3Ccircle cx='44' cy='22' r='3.5' fill='%23ff4f6e'/%3E%3C/svg%3E">
  <link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230a0d12'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%236ee0c8' stroke-width='2.5'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%236ee0c8' stroke-width='2'/%3E%3Ccircle cx='44' cy='22' r='3.5' fill='%23ff4f6e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#all-title" data-i18n="a11y.skip">一覧へ移動</a>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">⌖</span>
      <h1 class="brand-name" translate="no">ThreatRadar</h1>
      <span class="brand-update" id="last-updated">—</span>
    </div>
    <div class="quick-stats" id="quick-stats" aria-live="polite"></div>
    <div class="topbar-actions">
      <input type="search" id="search" name="q" autocomplete="off" spellcheck="false" placeholder="CVE-2026-… / vendor / 語句…" data-i18n-attr="aria-label:search.label" aria-label="検索">
      <button id="toggle-filters" class="btn-ghost only-narrow" aria-expanded="false" aria-controls="sidebar" data-i18n="action.filters">フィルター</button>
      <button id="toggle-lang" class="btn-ghost" data-i18n-attr="aria-label:action.lang" aria-label="表示言語の切り替え" translate="no">JA</button>
      <button id="toggle-theme" class="btn-ghost" data-i18n-attr="aria-label:action.theme" aria-label="配色の切り替え"><span aria-hidden="true">◐</span></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" data-i18n-attr="aria-label:filter.label" aria-label="フィルター">
      <section class="filter-group">
        <h3 data-i18n="filter.view">view</h3>
        <div class="chips">
          <button class="chip" id="starred-only" aria-pressed="false" data-i18n="action.starred_only">starred only</button>
          <button class="chip" id="auto-ja" aria-pressed="false" data-i18n="action.auto_ja">英語の記事を日本語で表示</button>
        </div>
      </section>
      <section class="filter-group">
        <h3 data-i18n="filter.severity">severity</h3>
        <div class="chips" id="filter-severity"></div>
      </section>
      <section class="filter-group">
        <h3 data-i18n="filter.category">category</h3>
        <div class="chips" id="filter-category"></div>
      </section>
      <section class="filter-group">
        <h3 data-i18n="filter.source">source</h3>
        <div class="chips compact" id="filter-source"></div>
      </section>
      <section class="filter-group">
        <h3 data-i18n="filter.tag">tag</h3>
        <div class="chips compact" id="filter-tag"></div>
      </section>
      <section class="filter-group">
        <h3 data-i18n="filter.vendor">vendor</h3>
        <div class="chips compact" id="filter-vendor"></div>
      </section>
      <section class="filter-group sticky-bottom">
        <button id="reset-filters" class="btn-ghost full-width" data-i18n="action.reset">reset filters</button>
      </section>
    </aside>

    <main>
      <details class="source-health hidden" id="source-health">
        <summary>
          <span class="health-title" data-i18n="health.title">source status</span>
          <span class="health-summary" id="health-summary"></span>
        </summary>
        <ul class="health-list" id="health-list"></ul>
      </details>

      <section class="critical-wall hidden" id="critical-wall">
        <h2 class="wall-title">
          <span class="wall-mark" aria-hidden="true">!</span>
          <span data-i18n="wall.title">Critical & high — last 7 days</span>
        </h2>
        <div class="wall-items" id="critical-items"></div>
      </section>

      <section class="today hidden" id="today-section">
        <h2 class="section-title">
          <span data-i18n="today.title">Last 24 hours</span>
          <span class="count" id="today-count"></span>
        </h2>
        <div class="feed compact" id="today-feed"></div>
      </section>

      <section class="all">
        <h2 class="section-title" id="all-title" tabindex="-1">
          <span data-i18n="all.title">All items</span>
          <span class="count" id="all-count"></span>
          <select id="sort-by" class="select-inline" data-i18n-attr="aria-label:sort.label" aria-label="並び順">
            <option value="published" data-i18n="sort.published">published (newest)</option>
            <option value="score" data-i18n="sort.score">score (highest)</option>
            <option value="epss" data-i18n="sort.epss">EPSS (highest)</option>
          </select>
        </h2>
        <div class="feed" id="all-feed">
          <div class="empty" data-i18n="state.loading">loading…</div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="assets/i18n.js"></script>
  <script src="assets/health.js"></script>
  <script src="assets/filters.js"></script>
  <script src="assets/translate.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
