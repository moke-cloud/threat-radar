# ThreatRadar collector configuration.
#
# - sources : list of feeds / APIs to poll
# - watch   : vendors / tags that get a score boost
# - retain  : how much history to keep per file
# - epss    : FIRST EPSS lookup for CVEs (public API, no key)
#
# Source policy (2026-11 review): keyless, machine-readable, primary or
# research-grade. Weight 1.0 = +30 base score points. See docs/SOURCES.md.

http:
  user_agent: "ThreatRadar/1.1 (+https://github.com/moke-cloud/threat-radar)"
  timeout_seconds: 60
  parallel: 8

retain:
  index_max_items: 500    # data/index.json keeps only the most recent N items
  daily_files_keep: 90    # delete data/items/YYYY-MM-DD.ndjson older than N days
  max_item_age_days: 30   # drop items published earlier than N days ago (KEV catalog, blog archives)

# FIRST EPSS (exploit prediction) for every CVE in new items. Public API, no key.
epss:
  enabled: true

# Japanese titles / summaries from a local model: llama.cpp's llama-server
# with Qwen3-4B-Instruct (started by scripts/start-llm.sh in the workflow).
# No API key, and feed text never leaves the runner; the endpoint must be
# loopback. Only items without a cached translation (data/translations.json)
# are sent, newest first, until max_requests or max_minutes is reached; the
# rest waits for the next run. Without a running server (local runs) only
# cached translations are applied.
translate:
  enabled: true
  endpoint: http://127.0.0.1:8080/v1/chat/completions
  model: Qwen3-4B-Instruct-2507-Q4_K_M
  batch_size: 1
  max_requests: 400
  max_minutes: 30

watch:
  vendors:
    - microsoft
    - cisco
    - fortinet
    - paloalto
    - citrix
    - vmware
    - ivanti
    - apache
    - openssl
    - linux
    - chrome
    - firefox
    - wordpress
    - jenkins
    - confluence
    - exchange
    - sharepoint
  tags:
    - kev
    - actively-exploited
    - 0day
    - rce
    - auth-bypass
    - supply-chain
    - ransomware

# ----------------------------------------------------------------------------

sources:

  # -- Government / CSIRT --

  - id: cisa-kev
    name: "CISA Known Exploited Vulnerabilities"
    type: cisa-kev
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    category: vuln
    weight: 1.5

  - id: cisa-advisories
    name: "CISA Cybersecurity Advisories"
    type: rss
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    category: advisory
    weight: 1.2

  - id: nvd-recent
    name: "NVD CVE recent"
    type: nvd
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    category: vuln
    weight: 1.0
    index_limit: 150   # at most 150 of the 500 index slots
    options:
      lookback_hours: 48
      max_pages: 8
      min_cvss: 8.0   # ~1000 new CVEs / 48h; keep the high-impact ones (CNA score used when NVD has none)

  - id: jpcert-at
    name: "JPCERT/CC 注意喚起"
